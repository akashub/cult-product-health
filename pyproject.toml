[project]
name = "cultph"
version = "0.1.0"
description = "Product health dashboard: reviews, ratings and returns for Cult massagers and scales"
authors = [
    { name = "Aakash Singh", email = "akashub@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "google-auth-oauthlib>=1.4.1",
    "gspread>=6.2.1",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "playwright>=1.63.0",
    "pyyaml>=6.0.3",
    "streamlit>=1.64.0",
]

[project.scripts]
cultph = "cultph.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
