# Example config with generic names. Copy to config.private.yaml (gitignored)
# and fill in the real tab names, column headers and SKU master.
source:
  type: xlsx                       # or: gsheet
  path: data/sample.xlsx           # `uv run python tests/make_fixture.py` creates this
  # spreadsheet_id: "<id from `cultph sheets`>"
  # auth: oauth                    # or service_account (never expires; share the sheet with its email)

dayfirst: true

tabs:
  tickets:
    name: Tickets
    columns: {ticket_id: Ticket Id, created_at: Created, month_label: Month, platform: Platform,
              order_id: Order ID, model: Model, l1: L1, l2: L2, l3: L3, subject: Subject}
  approved:
    name: Approved
    columns: {event_date: Date, month_label: Month, order_id: Order ID, batch: Batch, model: Model,
              sku: SKU, amount: Amount, issue: Issue, mode: Mode, channel: Channel, awb: AWB, warehouse: Warehouse}
  pending:
    name: Pending
    columns: {order_id: Order ID, sku: SKU, model: Model, created_at: Created, month_label: Month,
              reason: Reason, created_by: Created By, comment: Comment}
  wms:
    name: Warehouse
    columns: {created_at: Created, month_label: Month, channel_name: Channel, channel_type: Channel Type,
              return_type: Return Type, return_sub_type: Return Sub Type, reason: Reason, order_id: Order ID,
              item_code: Item Code, sku: SKU, model: Model, facility: Facility, status: Status}

  sales:                           # optional: units sold, for return % and selling %
    name: Sales
    columns: {date: Month, sku: SKU, model: Model, platform: Platform, units: Units, revenue: Revenue}
    # instead of a date column you can give month_label (e.g. "1~January") plus year

product_issue_l2: [Product]      # L2 values that mean "fault with the product"
not_mentioned: [Not Mentioned]

platform_map:                    # spelling variants -> canonical platform
  "1P": Cult Store
  "No details": Unknown

channel_prefixes:                # warehouse channel name prefix -> platform
  - [STORE, Cult Store]
  - [MARKET, Marketplace]

dashboard_check:                 # cells in the sheet's own pivot to reconcile against
  tab: Dashboard
  approved_header: Approved      # two adjacent header cells; month rows below, grand total last
  total_header: Total

thresholds:
  min_mapping_coverage: 0.98
  max_month_label_mismatch: 0

products:                        # SKU code is authoritative; aliases = spellings seen
  - {name: Sample Gun A, kind: gun, skus: [SKU-A1], aliases: [Gun A, Sample Gun A Blue]}
  - {name: Sample Foot B, kind: foot, skus: [SKU-B1, SKU-B2], aliases: [Foot B]}
  - {name: Sample Scale C, category: scale, kind: smart}   # category defaults to massager

amazon:
  domain: amazon.in
  target_rating: 4.1
  target_mode: displayed          # displayed: star shown as 4.1 (mean >= 4.05); exact: mean >= 4.1
  max_recent_pages: 10             # 'most recent' pages per poll; stops early once caught up
  delay_seconds: [4, 9]
  # Reviews in a shared rating pool are credited to a product only if the variant
  # text identifies it: {parent_asin: {"Colour: Blue": "Product"}}. Others stay pool-level.
  variant_map: {}            # random pause between requests
  asins:                           # ASIN -> product name (`cultph amazon-discover "<query>"` helps)
    B000000000: Sample Gun A

ai:
  provider: anthropic              # or openai (then set OPENAI_API_KEY and OpenAI model names)
  classifier_model: claude-haiku-4-5-20251001
  judge_model: claude-sonnet-5
  max_per_run: 200                 # cap per run (2 API calls each); a backlog clears over several runs
  audit_rate: 0.10                 # share of auto-accepted labels sent to a person, per product
  audit_min_per_product: 3
  taxonomy:                        # code: what counts. Align with the issue names in your return sheet.
    - {code: dead_on_arrival, description: "does not turn on at all, dead from the start or soon after"}
    - {code: stopped_working, description: "worked at first, then stopped"}
    - {code: charging, description: "does not charge, charges slowly, charger/port problems"}
    - {code: battery, description: "battery drains fast or short runtime"}
    - {code: noise_vibration, description: "loud, rattling, abnormal noise or vibration"}
    - {code: weak_power, description: "too weak, low intensity/speed, not effective"}
    - {code: heat_safety, description: "overheating, burning smell, sparks, shock, swelling"}
    - {code: buttons_controls, description: "buttons, display, app or remote not working"}
    - {code: damaged_defective, description: "arrived broken, scratched, missing parts, used/old unit"}
    - {code: accuracy, description: "weighing scale readings wrong or inconsistent"}
    - {code: build_quality, description: "feels cheap, parts break, poor materials"}
    - {code: size_fit, description: "does not fit feet/body, too small/big, uncomfortable"}
    - {code: service_warranty, description: "refund, replacement, warranty or customer support problems"}
    - {code: delivery, description: "late delivery, wrong item, packaging"}
    - {code: value_price, description: "overpriced or not worth the money"}

alerts:
  recent_days: 14                  # a review must be posted within this many days to alert
  channels: auto                   # every channel with credentials (desktop, telegram, slack, email); or a list
  return_spike_x: 2.0              # weekly returns >= 2x the trailing 4-week average...
  return_spike_min: 5              # ...and at least this many

flipkart:
  max_recent_pages: 5
  delay_seconds: [4, 9]
  listings:                        # product page path -> product (`cultph flipkart-discover "<query>"` helps)
    /sample-gun-a/p/itm0000000000000: Sample Gun A
